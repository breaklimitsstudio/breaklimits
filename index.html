<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Limits</title>
<style>
body { margin: 0; padding: 0; background: #0f0f0f; color: white; font-family: sans-serif; }
.container { display: flex; height: 100vh; align-items: center; justify-content: center; }
.form { width: 400px; text-align: center; }
.logo { font-size: 60px; color: #d7ff3f; font-weight: bold; margin-bottom: 20px; }
input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #333; border-radius: 5px; background: #1a1a1a; color: white; }
button { width: 100%; padding: 10px; margin-top: 20px; background: #d7ff3f; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
button:hover { background: #a8cc33; }
.error { color: #ef4444; display: none; margin: 10px 0; }
</style>
</head>
<body>
<div class="container">
<div class="form">
<div class="logo">BL</div>
<h1 id="title">Accedi</h1>
<div class="error" id="error"></div>
<form id="authForm">
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit" id="btn">Accedi</button>
</form>
<p style="margin-top: 20px; cursor: pointer; color: #d7ff3f;" onclick="toggleMode()">Non hai account? Registrati</p>
<div id="dashboard" style="display: none;">
<h2>Benvenuto!</h2>
<p id="userEmail"></p>
<button onclick="logout()">Logout</button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jfnjmondafdvhtfwymqh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CGp5eSzWFdJiQ-tpUIaCTw_QBo5SCsd';
const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let isSignUp = false;

function toggleMode() {
  isSignUp = !isSignUp;
  document.getElementById('title').textContent = isSignUp ? 'Registrati' : 'Accedi';
  document.getElementById('btn').textContent = isSignUp ? 'Crea Account' : 'Accedi';
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');
  
  errorDiv.style.display = 'none';
  
  try {
    let result = isSignUp ? 
      await supabase.auth.signUp({ email, password }) :
      await supabase.auth.signInWithPassword({ email, password });
    
    if (result.error) throw result.error;
    
    showDashboard(result.data.user);
  } catch (error) {
    errorDiv.textContent = error.message;
    errorDiv.style.display = 'block';
  }
});

function showDashboard(user) {
  document.getElementById('authForm').parentElement.style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('userEmail').textContent = '👤 ' + user.email;
}

async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

supabase.auth.onAuthStateChanged((user) => {
  if (user) showDashboard(user);
});
</script>
</body>
</html>
